name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install node
        uses: actions/setup-node@v7
        with:
          cache: yarn
      - name: yarn install
        run: yarn install
      - name: react-router typegen
        run: yarn run typegen
      - name: tsc
        run: yarn run tsc --noEmit
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install node
        uses: actions/setup-node@v7
        with:
          cache: yarn
      - name: yarn install
        run: yarn install
      - name: oxlint
        run: yarn run lint
  vitest:
    name: vitest
    runs-on: ubuntu-latest
    # The server code's tests run against a real Postgres; each test worker creates its own database on it
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: larp_library_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/larp_library_test
    steps:
      - uses: actions/checkout@v7
      - name: install node
        uses: actions/setup-node@v7
        with:
          cache: yarn
      - name: yarn install
        run: yarn install
      - name: vitest
        run: COVERAGE=true yarn run test
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          check_name: 'Vitest Report'
          report_paths: 'test/reports/TEST-vitest.xml'
      - name: Archive HTML test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-reports
          path: test/html_reports
      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-coverage
          path: coverage
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install node
        uses: actions/setup-node@v7
        with:
          cache: yarn
      - name: yarn install
        run: yarn install
      - name: react-router build
        run: yarn run build
  update-release-draft:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.event.ref == 'refs/heads/main'
    needs:
      - typecheck
      - lint
      - vitest
      - build
    outputs:
      name: ${{ steps.release-drafter.outputs.name }}
      html_url: ${{ steps.release-drafter.outputs.html_url }}
    steps:
      - uses: release-drafter/release-drafter@v7
        id: release-drafter
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Post about drafted release to Slack
        id: slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SlackToken }}
          payload: |
            {
              "channel": "${{ secrets.SlackCISuccessNotificationChannelID }}",
              "text": ${{ toJSON(format('Draft Larp Library release {0} updated:\n\n- {1}\n\nTo release Larp Library to production, visit: {2}', steps.release-drafter.outputs.name, join(github.event.commits.*.message, '\n- '), steps.release-drafter.outputs.html_url)) }}
            }
