name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs: {}

permissions:
  id-token: write # needed for configure-aws-credentials
  contents: read

jobs:
  sst-release:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: yarn
      - run: yarn install
      # GitHub's runners have a newer Pulumi pre-installed than the one SST bundles, and its language plugin conflicts with SST's.
      # Removing the system one makes SST use its own.
      - name: Fix Pulumi version conflict
        run: sudo rm -f /usr/local/bin/pulumi-language-nodejs
      - run: yarn run sst deploy --stage=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  notify-slack:
    runs-on: ubuntu-latest
    needs:
      - sst-release
    steps:
      - name: Format release notes for Slack
        id: format-release-notes
        uses: LoveToKnow/slackify-markdown-action@v1.1.1
        with:
          text: ${{ github.event.release.body }}
      - name: Post about release to Slack
        id: slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SlackToken }}
          payload: |
            {
              "channel": "${{ secrets.SlackReleaseNotificationChannelID }}",
              "text": "Larp Library ${{ github.event.release.name }} released to production",
              "unfurl_links": false,
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Larp Library ${{ github.event.release.name }} released to production"
                  }
                },
                { "type": "divider" },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(steps.format-release-notes.outputs.text) }}
                  }
                }
              ]
            }
